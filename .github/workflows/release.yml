name: release

# Pushing a tag v* builds the brisk binary for Linux aarch64 (static: one file
# that runs on a Raspberry Pi, Debian 12 or 13, or any other 64-bit Arm Linux)
# and macOS arm64 (with the Metal backend), and attaches both to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            flags: -DBRISK_STATIC=ON
          - os: macos-15
            name: macos-arm64
            flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
          cmake --build build-release --target brisk-cli

      - name: Smoke test
        run: |
          build-release/brisk 2>&1 | head -1 | grep -q usage
          build-release/brisk pull 2>&1 | grep -q qwen3-0.6b

      - name: Package
        run: |
          # The archive name carries no version, so releases/latest/download/<name> always works.
          dir=brisk-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$dir"
          cp build-release/brisk README.md "$dir"/
          tar czf "brisk-${{ matrix.name }}.tar.gz" "$dir"
          shasum -a 256 "brisk-${{ matrix.name }}.tar.gz" > "brisk-${{ matrix.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: brisk-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "brisk ${{ github.ref_name }}" \
            --notes "Binaries: \`brisk-linux-aarch64.tar.gz\` (static; Raspberry Pi 4/5 and any 64-bit Arm Linux) and \`brisk-macos-arm64.tar.gz\` (Apple silicon, with the Metal backend). Checksums alongside. See README.md for usage." \
            brisk-*.tar.gz brisk-*.tar.gz.sha256
